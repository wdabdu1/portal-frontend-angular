<div *ngIf="!auth.isLoggedIn()">
  <router-outlet />
</div>

<div *ngIf="auth.isLoggedIn()" style="font-family: sans-serif;">
  <!-- Top bar -->
  <div style="padding: 10px 20px; background: #0a3d62; color: white; display: flex; justify-content: space-between; align-items: center;">
    <strong>CTC Group Supply Chain Portal</strong>
    <div style="display: flex; align-items: center; gap: 12px; font-size: 13px;">
      <span>{{ auth.getDisplayName() }}</span>
      <button
        (click)="logout()"
        style="background: transparent; border: 1px solid white; color: white; padding: 4px 10px; border-radius: 4px; cursor: pointer;"
      >
        Log out
      </button>
    </div>
  </div>

  <!-- Menu bar -->
  <div style="padding: 8px 20px; background: #f7f7f7; border-bottom: 1px solid #ddd; display: flex; gap: 4px; position: relative; z-index: 30;">
    <div *ngFor="let group of menuGroups" style="position: relative;">
      <button
        (click)="toggleMenu(group.label, $event)"
        [style.background]="openMenu === group.label ? '#0a3d62' : 'white'"
        [style.color]="openMenu === group.label ? 'white' : '#333'"
        style="padding: 7px 14px; border-radius: 4px; border: 1px solid #ddd; font-size: 13px; cursor: pointer;"
      >
        {{ group.label }} ▾
      </button>

      <div
        *ngIf="openMenu === group.label"
        (click)="$event.stopPropagation()"
        style="position: absolute; top: 100%; left: 0; margin-top: 4px; background: white; border: 1px solid #ddd; border-radius: 4px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); min-width: 200px; overflow: hidden;"
      >
        
         <a *ngFor="let item of group.items"
          (click)="navigate(item)"
          [style.color]="item.canAccess(auth) ? '#333' : '#bbb'"
          [style.cursor]="item.canAccess(auth) ? 'pointer' : 'not-allowed'"
          style="display: flex; justify-content: space-between; align-items: center; padding: 9px 14px; font-size: 13px; text-decoration: none; border-bottom: 1px solid #f0f0f0;"
        >
          <span>{{ item.label }}</span>
          <span *ngIf="item.canAccess(auth)" (click)="toggleFavorite(item, $event)" [style.color]="isFavorite(item) ? '#f0a500' : '#ccc'" style="cursor: pointer; font-size: 14px;" [title]="isFavorite(item) ? 'Remove from Quick Access' : 'Add to Quick Access'">
            {{ isFavorite(item) ? '★' : '☆' }}
          </span>
        </a>
      </div>
    </div>
  </div>

  <!-- Shell: sidebar + main content -->
  <div style="display: flex; align-items: flex-start;">
    <div style="width: 200px; flex-shrink: 0; padding: 16px; border-right: 1px solid #eee; min-height: calc(100vh - 90px);">
      <p style="font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin: 0 0 8px;">Quick Access</p>
      <p *ngIf="favorites.length === 0" style="font-size: 12px; color: #bbb;">No favorites yet — click ☆ next to any menu item.</p>
      <div *ngFor="let fav of favorites" style="display: flex; justify-content: space-between; align-items: center; padding: 5px 0;">
        <a (click)="navigateFavorite(fav)" style="font-size: 13px; color: #333; text-decoration: none; cursor: pointer;">
          {{ fav.label }}
        </a>
        <span (click)="removeFavorite(fav)" style="color: #ccc; cursor: pointer; font-size: 13px;" title="Remove from Quick Access">×</span>
      </div>

      <div style="margin-top: 24px; padding-top: 16px; border-top: 1px solid #eee;">
        <a *ngIf="auth.canSeeSettings()" routerLink="/settings" style="display: block; padding: 6px 0; font-size: 13px; color: #333; text-decoration: none;">
          Settings
        </a>
        <span *ngIf="!auth.canSeeSettings()" style="display: block; padding: 6px 0; font-size: 13px; color: #bbb;">
          Settings
        </span>
      </div>
    </div>

    <div style="flex: 1; min-width: 0;">
      <router-outlet />
    </div>
  </div>
</div>
