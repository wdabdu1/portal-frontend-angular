<div style="max-width: 600px; margin: 2rem auto; font-family: sans-serif; padding: 0 1rem;">
  <a [routerLink]="['/clearance', shipmentId]" [queryParams]="{ section: 'costEstimate' }" style="font-size: 13px; color: #0a3d62; text-decoration: none;">&larr; Back to Clearance</a>
  <h1 style="font-size: 20px; font-weight: 500; margin-top: 8px;">Clearance Cost Estimate — Breakdown</h1>

  <p *ngIf="loading" style="color: #888; font-size: 13px;">Loading...</p>
  <p *ngIf="error" style="color: #c0392b; font-size: 13px;">{{ error }}</p>

  <table *ngIf="!loading" style="width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 1rem;">
    <thead>
      <tr style="text-align: left; border-bottom: 1px solid #ddd;">
        <th (click)="sortBy('chargeTypeName')" style="padding: 6px; cursor: pointer;">Charge Type</th>
        <th (click)="sortBy('valueSdg')" style="padding: 6px; cursor: pointer;">Value (SDG)</th>
        <th (click)="sortBy('dueDate')" style="padding: 6px; cursor: pointer;">Due Date</th>
        <th style="padding: 6px;"></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of sortedItems" style="border-bottom: 1px solid #eee;">
      <tr *ngFor="let item of items" style="border-bottom: 1px solid #eee;">
        <td style="padding: 6px;">{{ item.chargeTypeName }}</td>
        <td style="padding: 6px;">{{ item.valueSdg | number: '1.2-2' }}</td>
        <td style="padding: 6px; color: #888;">{{ item.dueDate ? (item.dueDate | date: 'MMM d, y') : '—' }}</td>
        <td style="padding: 6px;">
          <button (click)="remove(item.id)" style="color: #c0392b; background: none; border: none; cursor: pointer; font-size: 12px;">Remove</button>
        </td>
      </tr>
    </tbody>
    <tfoot>
      <tr style="border-top: 2px solid #ccc; font-weight: 600;">
        <td style="padding: 6px;">Total</td>
        <td style="padding: 6px;">{{ total | number: '1.2-2' }} SDG</td>
        <td colspan="2"></td>
      </tr>
    </tfoot>
  </table>

  <div style="margin-top: 1.5rem; display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap;">
    <div>
      <label style="display: block; font-size: 12px; color: #555;">Charge Type</label>
      <select [(ngModel)]="newChargeTypeId" style="padding: 6px; border: 1px solid #ccc; border-radius: 4px;">
        <option [ngValue]="null">-- select --</option>
        <option *ngFor="let c of chargeTypes" [ngValue]="c.id">{{ c['name'] }}</option>
      </select>
    </div>
    <div>
      <label style="display: block; font-size: 12px; color: #555;">Value (SDG)</label>
      <input type="text" appThousands [(ngModel)]="newValueSdg" style="padding: 6px; border: 1px solid #ccc; border-radius: 4px; width: 120px; box-sizing: border-box;" />
    </div>
    <div>
      <label style="display: block; font-size: 12px; color: #555;">Due Date</label>
      <input type="date" [(ngModel)]="newDueDate" style="padding: 6px; border: 1px solid #ccc; border-radius: 4px;" />
    </div>
    <button (click)="add()" [disabled]="adding" style="padding: 7px 14px; background: #0a3d62; color: white; border: none; border-radius: 4px; cursor: pointer;">
      {{ adding ? 'Adding...' : 'Add' }}
    </button>
  </div>
</div>
