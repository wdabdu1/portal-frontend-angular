<div style="max-width: 950px; margin: 2rem auto; font-family: sans-serif; padding: 0 1rem;">
  <div style="display: flex; justify-content: space-between; align-items: center;">
    <h1 style="font-size: 20px; font-weight: 500;">Shipments</h1>
    <a routerLink="/shipments/new" style="padding: 8px 16px; background: #0a3d62; color: white; border-radius: 4px; text-decoration: none; font-size: 13px;">
      + New Shipment
    </a>
  </div>
  <p style="color: #888; font-size: 12px; margin-top: 8px;">Drag a column header to reorder it. Click the ▼ arrow to filter that column.</p>

  <p *ngIf="loading" style="color: #888; font-size: 13px; margin-top: 1rem;">Loading...</p>
  <p *ngIf="error" style="color: #c0392b; font-size: 13px;">{{ error }}</p>

  <table *ngIf="!loading" style="width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 1rem;">
    <thead>
      <tr style="text-align: left; border-bottom: 1px solid #ddd;">
        <th
          *ngFor="let col of columns; let i = index"
          draggable="true"
          (dragstart)="onDragStart(i)"
          (dragover)="onDragOver($event)"
          (drop)="onDrop(i)"
          [style.background]="isColumnFiltered(col.key) ? '#e8f0f8' : 'transparent'"
          style="padding: 8px 6px; cursor: grab; user-select: none;"
        >
          <span (click)="sortBy(col.key)" style="cursor: pointer;">{{ col.label }}</span>
          <span (mousedown)="$event.stopPropagation()">
            <app-excel-header-filter [options]="optionsFor(col.key)" [selected]="filters[col.key]" (selectedChange)="onFilterChange(col.key, $event)" />
          </span>
        </th>
        <th style="padding: 8px 6px;"></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let s of shipments" (click)="viewDetails(s.id)" style="border-bottom: 1px solid #eee; cursor: pointer;">
        <td *ngFor="let col of columns" style="padding: 8px 6px;" [ngSwitch]="col.key">
          <span *ngSwitchCase="'blAwbNo'" style="font-family: monospace; color: #0a3d62;">{{ s.blAwbNo }}</span>
          <span *ngSwitchCase="'eta'" style="color: #888; font-size: 12px;">{{ s.eta ? (s.eta | date: 'MMM d, y') : '—' }}</span>
          <span *ngSwitchCase="'status'">
            <span
              [style.background]="s.status === 'Confirmed' ? '#e6f4ea' : '#fff4e5'"
              [style.color]="s.status === 'Confirmed' ? '#1e7e34' : '#a66a00'"
              style="padding: 2px 8px; border-radius: 4px; font-size: 12px;"
            >
              {{ s.status }}
            </span>
          </span>
          <span *ngSwitchDefault>{{ s[col.key] }}</span>
        </td>
        <td style="padding: 8px 6px;" (click)="$event.stopPropagation()">
          <a [routerLink]="['/shipments', s.id, 'update']" style="padding: 4px 10px; font-size: 12px; background: #eee; color: #333; border-radius: 4px; text-decoration: none;">
            Update
          </a>
        </td>
      </tr>
    </tbody>
  </table>

  <p *ngIf="!loading && shipments.length === 0" style="color: #888; font-size: 13px; margin-top: 1rem;">
    No shipments yet.
  </p>
</div>
