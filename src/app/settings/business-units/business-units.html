<div style="max-width: 640px; margin: 3rem auto; font-family: sans-serif;">
  <h1 style="font-size: 20px; font-weight: 500;">Settings — Business Units</h1>
  <p style="color: #666; font-size: 13px;">Reference pattern for the rest of the Settings/master-data tables.</p>

  <p *ngIf="error" style="color: #c0392b; font-size: 13px;">{{ error }}</p>
  <p *ngIf="loading" style="color: #888; font-size: 13px;">Loading...</p>

  <table *ngIf="!loading" style="width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 1rem;">
    <thead>
      <tr style="text-align: left; border-bottom: 1px solid #ddd;">
        <th style="padding: 6px;">Code</th>
        <th style="padding: 6px;">Name</th>
        <th style="padding: 6px;">Active</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let u of units" style="border-bottom: 1px solid #eee;">
        <td style="padding: 6px;">{{ u.code }}</td>
        <td style="padding: 6px;">{{ u.name }}</td>
        <td style="padding: 6px;">{{ u.isActive ? 'Yes' : 'No' }}</td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="canEdit" style="margin-top: 1.5rem; display: flex; gap: 8px; align-items: flex-end;">
    <div>
      <label style="display: block; font-size: 12px; color: #555;">Code</label>
      <input [(ngModel)]="newCode" style="padding: 6px; border: 1px solid #ccc; border-radius: 4px;" />
    </div>
    <div>
      <label style="display: block; font-size: 12px; color: #555;">Name</label>
      <input [(ngModel)]="newName" style="padding: 6px; border: 1px solid #ccc; border-radius: 4px;" />
    </div>
    <button (click)="add()" style="padding: 7px 14px; background: #0a3d62; color: white; border: none; border-radius: 4px; cursor: pointer;">Add</button>
  </div>

  <p *ngIf="!canEdit" style="margin-top: 1.5rem; color: #888; font-size: 13px;">
    Your role doesn't have permission to add Settings entries (Manager or SuperUser required).
  </p>
</div>
